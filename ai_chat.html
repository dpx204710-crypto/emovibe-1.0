<!DOCTYPE html>
<html>
<head>
  <title>AI聊天空间</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div id="chat-box"></div>
  <input id="msg" placeholder="说点什么...">
  <button id="send">发送</button>

  <script type="module">
    import { sendAIMessage } from './ai.js'
    const chatBox = document.getElementById('chat-box')
    const input = document.getElementById('msg')
    const character_id = localStorage.getItem('current_character')

    document.getElementById('send').onclick = async () => {
      const content = input.value
      input.value = ''
      const reply = await sendAIMessage(character_id, content)
      chatBox.innerHTML += `<p>你：${content}</p><p>${reply}</p>`
    }
  </script>
</body>
</html>
