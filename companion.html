<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>陪聊师接单 - Emovibe</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script type="module">
    import { supabase } from './assets/supabase.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const list = document.getElementById('orders');
      const { data, error } = await supabase.from('orders').select('*').order('id', { ascending: false });
      if (error) return alert("加载失败：" + error.message);

      list.innerHTML = data.map(o => `
        <div class="card">
          <h3>${o.type} · ${o.gender}</h3>
          <p>性格偏好：${o.preference}</p>
          <p>聊天方式：${o.mode}</p>
          <p>备注：${o.note || '无'}</p>
          <button class="primary" onclick="acceptOrder(${o.id})">接单</button>
        </div>
      `).join('');
    });

    window.acceptOrder = async (id) => {
      const { data: user } = await supabase.auth.getUser();
      if (!user.user) return alert("请先登录");
      const { error } = await supabase.from('orders').update({ companion_id: user.user.id }).eq('id', id);
      if (error) alert("接单失败：" + error.message);
      else alert("接单成功 💛");
    };
  </script>
</head>
<body>
  <header>
    <h1>陪聊师接单</h1>
    <a href="index.html"><button>返回首页</button></a>
  </header>

  <main>
    <h2>可接的订单 🌻</h2>
    <div id="orders"></div>
  </main>
</body>
</html>
