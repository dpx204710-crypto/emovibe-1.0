<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emovibe 登录 / 注册</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #3a7bd5, #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      color: #333;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 48%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      color: white;
    }
    .btn-login {
      background: #3a7bd5;
    }
    .btn-register {
      background: #00d2ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Emovibe 登录 / 注册</h2>
    <input id="email" type="email" placeholder="邮箱">
    <input id="password" type="password" placeholder="密码">
    <div style="display:flex; justify-content:space-between;">
      <button class="btn-login" id="login-btn">登录</button>
      <button class="btn-register" id="register-btn">注册</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://lryfufidcxnxdzglbzgq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyeWZ1ZmlkY3hueGR6Z2xiemdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwMjkzNzQsImV4cCI6MjA3NjYwNTM3NH0.2EeB26Ga2F2o9doXEhUORBB9k2YZniH-LQvZ5BZSBeU";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginBtn = document.getElementById("login-btn");
    const registerBtn = document.getElementById("register-btn");

    // 登录
    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) return alert("请输入邮箱和密码");

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert("登录失败：" + error.message);
      } else {
        alert("登录成功！");
        window.location.href = "chat.html";
      }
    });

    // 注册
    registerBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) return alert("请输入邮箱和密码");

      const { error } = await supabase.auth.signUp({ email, password });
      if (error) {
        alert("注册失败：" + error.message);
      } else {
        alert("注册成功，请登录！");
      }
    });
  </script>
</body>
</html>
