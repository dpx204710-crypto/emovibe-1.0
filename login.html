<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 / Login - Emovibe</title>
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="assets/lang.js"></script>
</head>
<body>
  <header>
    <h1>Emovibe</h1>
    <nav>
      <a href="index.html" data-lang="home">首页 / Home</a>
      <a href="login.html" data-lang="login">登录 / Login</a>
      <a href="join.html" data-lang="join">加入我们 / Join</a>
    </nav>
    <select id="language-switch">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </header>

  <main>
    <h2 data-lang="login">登录</h2>
    <form class="form-box" onsubmit="return false;">
      <label for="username" data-lang="username">用户名 / Username</label>
      <input type="text" id="username" placeholder="输入用户名 / Enter username" required>

      <label for="password" data-lang="password">密码 / Password</label>
      <input type="password" id="password" placeholder="输入密码 / Enter password" required>

      <button class="button" type="submit" onclick="login()">登录 / Login</button>
    </form>

    <p><a href="join.html" data-lang="join">还没有账号？加入我们 / Join Us</a></p>
  </main>

  <footer>
    <p>© 2025 Emovibe | Hope & Warmth for Everyone</p>
  </footer>

  <script>
    function login() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!user || !pass) {
        alert('请输入用户名和密码 / Please enter username and password.');
        return;
      }
      alert('登录成功（演示版）/ Login successful (Demo)');
      window.location.href = 'chat.html';
    }
  </script>
</body>
</html>
