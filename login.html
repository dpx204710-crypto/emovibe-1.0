<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 | Emovibe</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header"><div class="container header-inner"><div class="brand">💙 Emovibe</div></div></header>

  <main class="container">
    <section class="card">
      <h2>登录</h2>

      <form id="loginForm">
        <label>邮箱（Email）</label>
        <input id="email" type="email" required />

        <label>密码（Password）</label>
        <input id="password" type="password" required />

        <div style="margin-top:12px">
          <button class="btn" type="submit">登录 / Sign In</button>
          <a class="btn btn-light" href="join.html" style="margin-left:8px">注册</a>
        </div>
      </form>

      <p id="status" class="muted" style="margin-top:12px"></p>
    </section>
  </main>

  <footer class="site-footer"><div class="container">© 2025 Emovibe</div></footer>

  <script type="module">
    import { supabase } from './assets/supabase.js'

    const form = document.getElementById('loginForm')
    const status = document.getElementById('status')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      status.textContent = '正在登录...'

      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value

      const { data, error } = await supabase.auth.signInWithPassword({ email, password })
      if (error) {
        status.textContent = '登录失败：' + error.message
        return
      }

      // 登录成功 —— 尝试读取 profile 昵称并本地保存作回退
      const { data: profile } = await supabase.from('profiles').select('username').eq('user_id', data.user.id).single()
      const nickname = (profile && profile.username) || (data.user.user_metadata && data.user.user_metadata.name) || email.split('@')[0]
      localStorage.setItem('emovibe_nickname', nickname)

      status.textContent = '登录成功，即将跳转…'
      setTimeout(() => { window.location.href = 'index.html' }, 800)
    })
  </script>
</body>
</html>
