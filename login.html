<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 | Emovibe</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header>
    <h1>Emovibe 💙</h1>
    <nav>
      <a href="index.html">首页 / Home</a>
      <a href="login.html" class="active">登录 / Login</a>
      <a href="join.html">加入我们 / Join</a>
    </nav>
  </header>

  <main>
    <h2>登录到 Emovibe</h2>
    <p>欢迎回来，愿你在这里找到温暖与理解 🌻</p>

    <form id="login-form">
      <label for="email">邮箱 / Email</label>
      <input type="email" id="email" required placeholder="请输入注册邮箱" />

      <label for="password">密码 / Password</label>
      <input type="password" id="password" required placeholder="请输入密码" />

      <button type="submit">登录 / Sign In</button>
    </form>

    <p>还没有账号？ <a href="join.html">注册 / Join</a></p>
  </main>

  <footer>
    <p>© 2025 Emovibe | Hope & Warmth for Everyone</p>
  </footer>

  <script type="module">
    import { supabase } from './assets/supabase.js'

    const form = document.querySelector('#login-form')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()

      const email = document.querySelector('#email').value.trim()
      const password = document.querySelector('#password').value.trim()

      if (!email || !password) {
        alert('⚠️ 请填写完整信息。')
        return
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      })

      if (error) {
        alert('❌ 登录失败：' + error.message)
        return
      }

      // 检查邮箱是否验证
      const { data: userData } = await supabase.auth.getUser()
      if (!userData.user.email_confirmed_at) {
        alert('📩 请先验证邮箱后再登录（检查邮箱收件箱或垃圾箱）')
        await supabase.auth.signOut()
        return
      }

      alert('✅ 登录成功，欢迎回来！')
      window.location.href = 'index.html'
    })
  </script>
</body>
</html>
