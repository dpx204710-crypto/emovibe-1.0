<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emovibe 登录 | Login</title>
  <link rel="stylesheet" href="assets/style.css">

  <style>
    body {
      background: linear-gradient(180deg, #0a0a0a, #1a1a1a);
      font-family: "Microsoft YaHei", sans-serif;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: rgba(25, 25, 25, 0.9);
      border: 1px solid #444;
      border-radius: 14px;
      padding: 40px 30px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.1);
    }

    h1 {
      font-size: 28px;
      color: #ffd700;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      background: #2a2a2a;
      color: #f5f5f5;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #ffd700;
    }

    button {
      width: 100%;
      background: linear-gradient(90deg, #d4af37, #ffd700);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: linear-gradient(90deg, #ffd700, #d4af37);
      transform: scale(1.03);
    }

    .msg-success {
      color: #00ff88;
      font-size: 14px;
      margin-top: 10px;
    }

    .msg-error {
      color: #ff5555;
      font-size: 14px;
      margin-top: 10px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #777;
    }

    .footer a {
      color: #ffd700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Emovibe</h1>
    <h2>让生活充满温暖 · Fill Life with Warmth</h2>

    <form id="login-form">
      <input type="text" id="username" placeholder="用户名 / Username" required>
      <input type="password" id="password" placeholder="密码 / Password" required>
      <button type="submit">登录 / Login</button>
      <div id="login-message"></div>
    </form>

    <div class="footer">
      © 2025 Emovibe | <a href="#">隐私政策 / Privacy</a>
    </div>
  </div>

  <script src="assets/login.js"></script>
</body>
</html>
<script>
function handleLogin() {
  const username = document.getElementById("username").value.trim();
  if (!username) {
    alert("请输入昵称");
    return;
  }
  localStorage.setItem("emovibe_user", username);
  window.location.href = "chat.html";
}
</script>
<button onclick="handleLogin()">进入聊天室</button>
