<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emovibe 登录</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="login-container">
    <h1>Emovibe</h1>
    <h2>让生活充满温暖 · Fill Life with Warmth</h2>

    <form id="login-form" onsubmit="event.preventDefault(); handleLogin();">
      <input type="text" id="username" placeholder="请输入昵称 / Enter your name" />
      <button type="submit">进入聊天室 / Enter Chat</button>
    </form>

    <div class="footer">
      © 2025 Emovibe | <a href="#">隐私政策 / Privacy Policy</a>
    </div>
  </div>

  <script>
  function handleLogin() {
    const username = document.getElementById("username").value.trim();
    if (!username) {
      alert("请输入昵称");
      return;
    }
    localStorage.setItem("emovibe_user", username);
    window.location.href = "chat.html";
  }
  </script>
</body>
</html>
