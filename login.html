<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 | Emovibe</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <header>
    <h1>💙 欢迎登录 Emovibe</h1>
  </header>

  <main style="max-width:400px; margin:auto; padding:20px;">
    <form id="login-form">
      <label>邮箱：</label>
      <input type="email" id="email" placeholder="请输入邮箱" required />

      <label>密码：</label>
      <input type="password" id="password" placeholder="请输入密码" required />

      <button type="submit" class="btn">登录 / Login</button>
    </form>

    <p id="status" style="text-align:center; color:green; margin-top:15px;"></p>
    <p style="text-align:center; margin-top:10px;">
      还没有账号？<a href="join.html">去注册 / Join</a>
    </p>
  </main>

  <footer>
    © 2025 Emovibe | 温暖每一份情绪
  </footer>

  <script type="module">
    import { supabase } from './assets/supabase.js'

    const form = document.getElementById('login-form')
    const statusEl = document.getElementById('status')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      statusEl.textContent = '正在登录中... ⏳'

      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value.trim()

      // 调用 Supabase 登录
      const { data, error } = await supabase.auth.signInWithPassword({ email, password })

      if (error) {
        statusEl.textContent = '❌ 登录失败，请检查邮箱或密码'
      } else {
        // 保存用户名（用邮箱前半部分作为默认昵称）
        const username = email.split('@')[0]
        localStorage.setItem('username', username)

        statusEl.textContent = '✅ 登录成功！正在跳转...'
        setTimeout(() => {
          window.location.href = 'index.html'
        }, 1000)
      }
    })
  </script>
</body>
</html>
