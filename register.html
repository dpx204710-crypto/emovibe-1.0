<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>注册 - Emovibe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="form-container">
    <h2>创建新账号</h2>
    <input id="emailR" type="email" placeholder="邮箱" />
    <input id="passwordR" type="password" placeholder="密码" />
    <button class="submit-btn" id="regBtn">注册</button>
    <p style="margin-top:10px;">已有账号？ <a href="login.html">登录</a></p>
  </div>

  <script>
    const client = window.supabase.createClient("https://lryfufidcxnxdzglbzgq.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyeWZ1ZmlkY3hueGR6Z2xiemdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwMjkzNzQsImV4cCI6MjA3NjYwNTM3NH0.2EeB26Ga2F2o9doXEhUORBB9k2YZniH-LQvZ5BZSBeU");

    document.getElementById('regBtn').addEventListener('click', async () => {
      const email = document.getElementById('emailR').value;
      const password = document.getElementById('passwordR').value;
      const { data, error } = await client.auth.signUp({ email, password });
      if (error) return alert("注册失败：" + error.message);
      alert("注册成功，已发送确认邮件（或直接登录）");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
