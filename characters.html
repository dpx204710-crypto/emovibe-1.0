<!DOCTYPE html>
<html>
<head>
  <title>我的AI角色</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h2>我的AI角色</h2>
  <div id="balance"></div>
  <div id="list"></div>

  <script type="module">
    import { getBalance, getMyCharacters } from './ai.js'

    async function load() {
      const balance = await getBalance()
      document.getElementById('balance').innerText = `💰 当前余额：${balance} 金币`

      const chars = await getMyCharacters()
      const list = document.getElementById('list')
      list.innerHTML = chars.length
        ? chars.map(c => `
            <div class="char-card">
              <img src="${c.avatar_url || 'https://placekitten.com/120/120'}" width="80" height="80">
              <h3>${c.name}</h3>
              <p>${c.personality || '这个AI还没定义性格。'}</p>
              <button onclick="goChat('${c.id}')">进入聊天</button>
            </div>
          `).join('')
        : '<p>你还没有创建AI角色</p>'
    }

    window.goChat = id => {
      localStorage.setItem('current_character', id)
      window.location.href = './chat.html'
    }

    load()
  </script>
</body>
</html>
