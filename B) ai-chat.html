<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><title>AI 聊天</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head><body>
<header class="navbar"><div class="logo">Emovibe AI</div></header>
<div class="chat-box">
  <div id="messages" class="messages"></div>
  <div class="input-area">
    <input id="msgInput" placeholder="和你的AI聊聊..." />
    <button id="sendBtn">发送</button>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(location.search);
let conversationId = urlParams.get('conversation_id');
const characterId = urlParams.get('character_id');

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadMessages() {
  if (!conversationId) return;
  const { data } = await client.from('ai_messages').select('*').eq('conversation_id', conversationId).order('created_at', { ascending: true });
  const box = document.getElementById('messages');
  box.innerHTML = (data || []).map(m => `<div class="message ${m.role==='user' ? 'user':'other'}"><b>${m.sender || (m.role==='assistant'?'AI':'你')}</b><div>${m.content}</div></div>`).join('');
  box.scrollTop = box.scrollHeight;
}

document.getElementById('sendBtn').addEventListener('click', async () => {
  const text = document.getElementById('msgInput').value.trim();
  if (!text) return;
  document.getElementById('msgInput').value = '';
  // call server ai-chat
  const { data: userRes } = await client.auth.getUser();
  const userId = userRes?.user?.id;
  const resp = await fetch('/api/ai-chat', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ conversationId, characterId, userId, message: text })
  });
  const j = await resp.json();
  await loadMessages();
});

loadMessages();
</script>
</body></html>
