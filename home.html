<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emovibe | 主页 / Home</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f0f4ff, #dce7ff);
      text-align: center;
      padding: 40px 20px;
      color: #333;
    }
    header {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #4b9cd3;
    }
    .user-box {
      background: white;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      padding: 20px;
      max-width: 400px;
      margin: 0 auto 30px;
    }
    .btn {
      display: block;
      background: #4b9cd3;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      text-decoration: none;
      margin: 10px auto;
      width: 80%;
      font-size: 16px;
      transition: 0.3s;
    }
    .btn:hover { background: #357aa8; }
  </style>
</head>
<body>
  <header>💙 Emovibe | 让生活充满温暖 / Fill Life with Warmth</header>

  <div class="user-box">
    <h2>欢迎回来，<span id="username">用户</span>！</h2>
    <p>当前余额：<span id="balance">￥0.00</span></p>
  </div>

  <a href="chat.html" class="btn">💬 进入聊天 / Chat Now</a>
  <a href="join.html" class="btn">🌿 成为陪聊师 / Be a Companion</a>
  <a href="#" class="btn">💰 充值中心 / Top Up</a>

  <p style="margin-top: 40px; font-size: 14px; color: #777;">© 2025 Emovibe | All Rights Reserved.</p>

  <script>
    document.getElementById("username").textContent = localStorage.getItem("username") || "用户";
    document.getElementById("balance").textContent = localStorage.getItem("balance") || "￥0.00";
  </script>
</body>
</html>
