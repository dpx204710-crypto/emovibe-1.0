<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Emovibe 登录</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="container">
  <h1>Emovibe</h1>
  <input id="email" placeholder="邮箱">
  <input id="password" type="password" placeholder="密码">
  <select id="role">
    <option value="client">我是客户</option>
    <option value="companion">我是陪聊师</option>
  </select>
  <button id="loginBtn">登录</button>
  <button id="registerBtn">注册</button>
</div>

<script type="module">
import { login, register } from './app.js'
document.getElementById('loginBtn').onclick = () => login(email.value, password.value)
document.getElementById('registerBtn').onclick = () => register(email.value, password.value, '用户', '未知', role.value)
</script>
</body>
</html>
