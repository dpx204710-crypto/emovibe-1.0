<script type="module">
  import { supabase } from './assets/supabase.js'

  async function loadUser() {
    const { data: { user } } = await supabase.auth.getUser()

    if (!user) {
      window.location.href = "login.html"
      return
    }

    document.getElementById('username').textContent = user.email
  }

  loadUser()
</script>
