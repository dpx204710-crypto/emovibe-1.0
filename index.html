
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emovibe - 让生活充满温暖 | Feel the Warmth of Life</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <h1>💛 Emovibe</h1>
    <p>让生活充满温暖 · Feel the Warmth of Life</p>
    <nav>
      <a href="index.html">首页 / Home</a>
      <a href="join.html">加入我们 / Join</a>
      <a href="login.html">登录 / Login</a>
    </nav>
  </header>

  <main>
    <section class="welcome">
      <h2>欢迎来到 Emovibe</h2>
      <p>一个让人们倾诉、陪伴、疗愈、互相温暖的情感陪聊平台。</p>
      <p>在这里，你可以成为陪聊师，也可以找到倾听你的人。</p>
      <button onclick="window.location.href='join.html'">开始体验 / Start Now</button>
    </section>
  </main>

  <footer>
    <p>© 2025 Emovibe | All Rights Reserved.</p>
  </footer>

  <script type="module">
    import { supabase } from './assets/supabase.js'

    const userArea = document.querySelector('header nav')
    const { data: { session } } = await supabase.auth.getSession()

    if (session) {
      userArea.innerHTML = `
        <a href="index.html">首页</a>
        <span>你好，${session.user.email}</span>
        <a href="#" id="logout">退出</a>
      `
      document.getElementById('logout').addEventListener('click', async () => {
        await supabase.auth.signOut()
        window.location.reload()
      })
    }
  </script>
</body>
</html>
