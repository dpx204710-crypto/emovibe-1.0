<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmoVibe | 温暖陪伴 · 治愈心灵</title>
  <link rel="icon" href="/logo.png" />
  <style>
    :root {
      --primary: #ffcc66;
      --secondary: #fff7e6;
      --text: #333;
      --shadow: rgba(0,0,0,0.08);
    }
    * {margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", "Noto Sans SC", sans-serif;}
    body {background: var(--secondary); color: var(--text);}

    /* 顶栏 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
      background: white;
      box-shadow: 0 2px 8px var(--shadow);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .logo {font-size: 1.6rem; font-weight: 700; color: var(--primary);}
    header nav a {
      margin-left: 25px;
      text-decoration: none;
      color: #555;
      font-weight: 500;
      transition: 0.3s;
    }
    header nav a:hover {color: var(--primary);}

    /* Hero 区 */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 100px 60px;
      flex-wrap: wrap;
    }
    .hero-text {max-width: 500px;}
    .hero-text h1 {
      font-size: 2.8rem;
      color: #333;
      line-height: 1.3;
    }
    .hero-text p {margin-top: 15px; color: #666; font-size: 1.1rem;}
    .cta {
      display: inline-block;
      margin-top: 25px;
      background: var(--primary);
      color: white;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 3px 10px var(--shadow);
      transition: 0.3s;
    }
    .cta:hover {transform: translateY(-2px); background: #ffb84d;}
    .hero img {
      width: 420px;
      border-radius: 20px;
      box-shadow: 0 8px 20px var(--shadow);
    }

    /* 功能卡片区 */
    .features {
      padding: 80px 60px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      background: white;
    }
    .feature {
      width: 300px;
      background: var(--secondary);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 12px var(--shadow);
      margin: 20px;
      text-align: center;
      transition: 0.3s;
    }
    .feature:hover {transform: translateY(-4px);}
    .feature h3 {color: var(--primary); margin-bottom: 10px;}
    .feature p {color: #555; font-size: 0.95rem;}

    /* 人物展示区 */
    .showcase {
      padding: 80px 60px;
      text-align: center;
    }
    .showcase h2 {margin-bottom: 40px; font-size: 2rem; color: #444;}
    .profiles {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
    }
    .profile {
      background: white;
      border-radius: 20px;
      width: 200px;
      box-shadow: 0 5px 15px var(--shadow);
      padding: 20px;
    }
    .profile img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 10px;
    }
    .profile h4 {color: #333;}
    .profile span {display: block; color: var(--primary); margin-top: 5px;}

    /* CTA 区 */
    .join {
      text-align: center;
      padding: 100px 20px;
      background: var(--primary);
      color: white;
    }
    .join h2 {font-size: 2rem; margin-bottom: 15px;}
    .join a {
      display: inline-block;
      background: white;
      color: var(--primary);
      padding: 12px 26px;
      border-radius: 30px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }
    .join a:hover {background: #fff7e6;}

    /* Footer */
    footer {
      background: #333;
      color: #ddd;
      text-align: center;
      padding: 40px 10px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">EmoVibe</div>
    <nav>
      <a href="/">首页</a>
      <a href="/chat">聊天</a>
      <a href="/ai">AI角色</a>
      <a href="/login">登录</a>
      <a href="/register">注册</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>温暖的陪伴，从 EmoVibe 开始</h1>
      <p>无论你需要倾诉、安慰，还是一个懂你的人，EmoVibe 为你连接真实的陪聊师与AI知心伙伴。</p>
      <a href="/register" class="cta">立即加入</a>
    </div>
    <img src="https://i.imgur.com/S7gS6qg.png" alt="陪伴插画">
  </section>

  <section class="features">
    <div class="feature">
      <h3>AI 心灵伙伴</h3>
      <p>与你对话、安慰、记录心情的智能角色，可自定义性格与声音。</p>
    </div>
    <div class="feature">
      <h3>真人陪聊师</h3>
      <p>经过认证的真人倾听者，随时为你提供温暖与理解。</p>
    </div>
    <div class="feature">
      <h3>安全与隐私</h3>
      <p>所有聊天均加密，确保你的故事只属于你自己。</p>
    </div>
  </section>

  <section class="showcase">
    <h2>热门角色</h2>
    <div class="profiles">
      <div class="profile">
        <img src="https://i.imgur.com/8Yg3v9W.jpg" alt="角色1">
        <h4>暖阳</h4>
        <span>温柔 | 倾听型</span>
      </div>
      <div class="profile">
        <img src="https://i.imgur.com/I1LrU8y.jpg" alt="角色2">
        <h4>月影</h4>
        <span>神秘 | 理性型</span>
      </div>
      <div class="profile">
        <img src="https://i.imgur.com/nD7fP6v.jpg" alt="角色3">
        <h4>小晴</h4>
        <span>活泼 | 陪伴型</span>
      </div>
    </div>
  </section>

  <section class="join">
    <h2>开始你的情感之旅 💛</h2>
    <a href="/register">立即注册</a>
  </section>

  <footer>
    © 2025 EmoVibe | 温暖陪伴 · 治愈心灵
  </footer>

</body>
</html>
