<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加入我们 | Emovibe</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <h1>Emovibe 💙</h1>
    <nav>
      <a href="index.html">首页 / Home</a>
      <a href="login.html">登录 / Login</a>
      <a href="join.html" class="active">加入我们 / Join</a>
    </nav>
  </header>

  <main>
    <h2>加入我们</h2>
    <p>成为 Emovibe 的一员，无论你想倾诉，还是愿意倾听。<br>
       每一次交流，都是一次心灵的相遇。</p>

    <form id="join-form">
      <label for="nickname">昵称 / Nickname</label>
      <input type="text" id="nickname" required placeholder="请输入昵称">

      <label for="email">邮箱 / Email</label>
      <input type="email" id="email" required placeholder="请输入邮箱地址">

      <label for="password">密码 / Password</label>
      <input type="password" id="password" required placeholder="请输入密码">

      <label for="role">角色 / Role</label>
      <select id="role">
        <option value="user">普通用户 / User</option>
        <option value="listener">陪聊师 / Listener</option>
      </select>

      <button type="submit">提交申请 / Submit</button>
    </form>

    <p>已有账号？ <a href="login.html">登录 / Login</a></p>
  </main>

  <footer>
    <p>© 2025 Emovibe | Hope & Warmth for Everyone</p>
  </footer>

  <script type="module">
    import { supabase } from './assets/supabase.js'

    const form = document.querySelector('#join-form')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()

      const email = document.querySelector('#email').value.trim()
      const password = document.querySelector('#password').value.trim()
      const nickname = document.querySelector('#nickname').value.trim()
      const role = document.querySelector('#role').value

      if (!email || !password || !nickname) {
        alert('⚠️ 请填写完整信息后再提交。')
        return
      }

      // 调用 Supabase 注册接口
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { nickname, role }
        }
      })

      if (error) {
        alert('❌ 注册失败：' + error.message)
        return
      }

      // 成功提示
      alert('✅ 注册成功！请前往邮箱查收验证邮件（可能在垃圾箱）📩')

      // 跳转到登录页面
      window.location.href = 'login.html'
    })
  </script>
</body>
</html>
