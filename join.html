<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>加入 Emovibe | 成为陪聊师或用户</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <h1>加入 Emovibe</h1>

  <form id="join-form">
    <label>邮箱 / Email</label>
    <input type="email" id="email" required />

    <label>密码 / Password</label>
    <input type="password" id="password" required />

    <label>昵称 / Nickname</label>
    <input type="text" id="nickname" required />

    <label>角色 / Role</label>
    <select id="role">
      <option value="user">普通用户 / User</option>
      <option value="listener">陪聊师 / Listener</option>
    </select>

    <button type="submit">注册 / Sign Up</button>
  </form>

  <p>已有账号？<a href="login.html">去登录</a></p>

  <script type="module">
    import { supabase } from './assets/supabase.js'

    const form = document.getElementById('join-form')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()

      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const nickname = document.getElementById('nickname').value
      const role = document.getElementById('role').value

      const { data, error } = await supabase.auth.signUp({ email, password })

      if (error) {
        alert('注册失败：' + error.message)
        return
      }

      const { error: insertError } = await supabase
        .from('profiles')
        .insert([{ username: nickname, email, role }])

      if (insertError) {
        alert('保存资料失败：' + insertError.message)
        return
      }

      alert('注册成功！请查收验证邮件！')
      window.location.href = 'login.html'
    })
  </script>
</body>
</html>
