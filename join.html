<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加入我们 | Emovibe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Emovibe</h1>
    <nav>
      <a href="index.html">首页 / Home</a>
      <a href="login.html">登录 / Login</a>
      <a href="join.html" class="active">加入我们 / Join</a>
    </nav>
  </header>

  <main>
    <h2>加入我们</h2>
    <p>成为 Emovibe 的一员，无论你想倾诉，还是愿意倾听。每一次交流，都是一次心灵的相遇。</p>

    <form id="join-form">
      <label>昵称 / Nickname</label>
      <input type="text" id="nickname" required>

      <label>账号 / Username</label>
      <input type="text" id="username" required>

      <label>密码 / Password</label>
      <input type="password" id="password" required>

      <label>角色 / Role</label>
      <select id="role">
        <option value="user">普通用户 / User</option>
        <option value="listener">陪聊师 / Listener</option>
      </select>

      <button type="submit">提交申请 / Submit</button>
    </form>

    <p>已有账号？<a href="login.html">登录 / Login</a></p>
  </main>

  <footer>
    <p>© 2025 Emovibe | Hope & Warmth for Everyone</p>
  </footer>

  <script>
    document.getElementById("join-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const nickname = document.getElementById("nickname").value;
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;

      // 存储用户信息到本地 localStorage
      const users = JSON.parse(localStorage.getItem("users")) || {};
      if (users[username]) {
        alert("❌ 该用户名已存在，请换一个！");
        return;
      }

      users[username] = { nickname, password, role };
      localStorage.setItem("users", JSON.stringify(users));

      alert("✅ 注册成功！请登录。");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
