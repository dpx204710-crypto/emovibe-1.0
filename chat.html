<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emovibe Chat - 温暖陪伴</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #101010, #2b2b2b);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    h2 {
      margin: 20px 0 10px;
      color: #f0c14b;
    }
    .chat-container {
      flex: 1;
      width: 95%;
      max-width: 600px;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      margin: 6px 0;
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.5;
    }
    .msg.user {
      background: #4a90e2;
      align-self: flex-end;
    }
    .msg.ai {
      background: #333;
      align-self: flex-start;
    }
    .input-area {
      display: flex;
      margin-top: 8px;
      gap: 6px;
    }
    .input-area input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
      font-size: 15px;
    }
    .input-area button {
      background: #f0c14b;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 10px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h2 id="welcome"></h2>

  <div class="chat-container">
    <div id="chat-box" class="chat-box"></div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="说点什么吧..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>

  <footer>
    <p>© 2025 Emovibe | Hope & Warmth for Everyone</p>
  </footer>

  <script>
    // 💫 显示昵称
    const username = localStorage.getItem("emovibe_user") || "访客";
    document.getElementById("welcome").textContent = `欢迎回来，${username} 🌻`;

    // 💬 聊天逻辑
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const msg = input.value.trim();
      if (!msg) return;

      const box = document.getElementById('chat-box');
      box.innerHTML += `<div class="msg user">${msg}</div>`;
      input.value = '';
      box.scrollTop = box.scrollHeight;

      // 模拟AI回复（之后可换为真实API）
      box.innerHTML += `<div class="msg ai">⏳ 正在思考...</div>`;
      box.scrollTop = box.scrollHeight;

      setTimeout(() => {
        const responses = [
          "我在听呢，慢慢说，不用着急。",
          "有时候，说出来本身就是一种治愈。",
          "你做得已经很好了 🌟",
          "每个人都会有低落的时候，我理解你。",
          "一切都会好起来的，相信我 💫"
        ];
        const aiMsg = responses[Math.floor(Math.random() * responses.length)];
        box.lastChild.innerHTML = aiMsg;
        box.scrollTop = box.scrollHeight;
      }, 1000);
    }
  </script>

</body>
</html>
