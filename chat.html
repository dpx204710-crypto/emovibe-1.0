<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>温暖聊天 / Chat - Emovibe</title>
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="assets/lang.js"></script>
  <style>
    body {
      background: linear-gradient(145deg, #0b0b0b, #1a1a1a);
      color: #f0f0f0;
    }

    .chat-container {
      max-width: 800px;
      margin: 80px auto;
      background: rgba(30, 30, 30, 0.85);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
    }

    .chat-box {
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      background: rgba(20, 20, 20, 0.8);
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .msg {
      margin: 10px 0;
      padding: 10px 15px;
      border-radius: 10px;
      max-width: 70%;
      line-height: 1.6;
    }

    .user {
      background: #f5d36c;
      color: #000;
      margin-left: auto;
      text-align: right;
    }

    .ai {
      background: rgba(255, 255, 255, 0.1);
      color: #f0f0f0;
      margin-right: auto;
    }

    .chat-input {
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
    }

    .chat-input button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #f5d36c, #b48a28);
      color: #000;
      cursor: pointer;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Emovibe</h1>
    <nav>
      <a href="index.html" data-lang="home">首页 / Home</a>
      <a href="login.html" data-lang="login">登录 / Login</a>
      <a href="join.html" data-lang="join">加入 / Join</a>
    </nav>
    <select id="language-switch">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </header>

  <main>
    <div class="chat-container">
      <h2 data-lang="chat">温暖的对话 / Warm Chat</h2>
      <div id="chat-box" class="chat-box"></div>
      <div class="chat-input">
        <input type="text" id="user-input" placeholder="说点什么... / Say something..." />
        <button onclick="sendMessage()" data-lang="send">发送 / Send</button>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 Emovibe | Hope & Warmth for Everyone</p>
  </footer>

  <script>
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const msg = input.value.trim();
      if (!msg) return;

      const box = document.getElementById('chat-box');
      box.innerHTML += `<div class="msg user">${msg}</div>`;
      input.value = '';
      box.scrollTop = box.scrollHeight;

      // 模拟 AI 回复（可换成真实接口）
      box.innerHTML += `<div class="msg ai">⏳ 正在倾听...</div>`;
      box.scrollTop = box.scrollHeight;

      setTimeout(() => {
        const responses = [
          "我在听呢，慢慢说，不用着急。",
          "有时候，说出来本身就是一种治愈。",
          "你做得已经很好了。",
          "每个人都会有低落的时候，我理解你。",
          "一切都会好起来的，相信我。"
        ];
        const aiMsg = responses[Math.floor(Math.random() * responses.length)];
        box.lastChild.innerHTML = aiMsg;
        box.scrollTop = box.scrollHeight;
      }, 1200);
    }
  </script>
</body>
</html>
