<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emovibe 聊天室 | 温暖陪伴</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1f2937;
      color: white;
      padding: 12px;
      text-align: center;
      font-size: 20px;
      letter-spacing: 1px;
    }
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .message {
      max-width: 80%;
      margin: 10px 0;
      padding: 10px 15px;
      border-radius: 12px;
      line-height: 1.4;
    }
    .user {
      background-color: #3b82f6;
      color: white;
      align-self: flex-end;
    }
    .ai {
      background-color: #e5e7eb;
      color: #111827;
      align-self: flex-start;
    }
    footer {
      display: flex;
      border-top: 1px solid #ddd;
      background-color: white;
      padding: 10px;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      margin-left: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1e40af;
    }
  </style>
</head>
<body>
  <header>💬 Emovibe - 温暖陪聊室</header>

  <div id="chat-box"></div>

  <footer>
    <input type="text" id="messageInput" placeholder="输入你的心里话..." />
    <button onclick="sendMessage()">发送</button>
  </footer>

  <script>
    // ✅ 你的 Supabase 连接信息（你之前发给我的）
    const SUPABASE_URL = "https://lryfufidcxnxdzglbzgq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyeWZ1ZmlkY3hueGR6Z2xiemdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwMjkzNzQsImV4cCI6MjA3NjYwNTM3NH0.2EeB26Ga2F2o9doXEhUORBB9k2YZniH-LQvZ5BZSBeU";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const apiUrl = '/api/chat'; // 调用 Vercel 上的 AI 接口

    const nickname = '用户'; // 可改为登录昵称

    // ✅ 页面加载时读取聊天记录
    window.onload = async () => {
      const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
      if (data) {
        data.forEach(msg => addMessage(msg.role, msg.content));
      }
    };

    // ✅ 发送消息
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message) return;

      addMessage('user', message);
      input.value = '';

      // 保存用户消息到数据库
      await supabase.from('messages').insert([{ role: 'user', content: message }]);

      // 请求 AI 回复
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname, message })
      });

      const data = await res.json();
      const reply = data.reply || "（AI无回复）";

      addMessage('ai', reply);

      // 保存 AI 回复
      await supabase.from('messages').insert([{ role: 'ai', content: reply }]);
    }

    // ✅ 显示消息
    function addMessage(role, text) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.classList.add('message', role);
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
