<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emovibe · 情感陪聊AI</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #f2f2f2;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 90%;
      max-width: 500px;
      height: 80vh;
      background: #111;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      padding-right: 10px;
    }
    .msg {
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      background: #222;
      line-height: 1.4;
    }
    .msg.me {
      background: #1e88e5;
      color: white;
      align-self: flex-end;
    }
    .msg.ai {
      background: #4caf50;
      color: white;
      align-self: flex-start;
    }
    .timestamp {
      font-size: 10px;
      color: #888;
      margin-top: 3px;
    }
    input, button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    input {
      flex: 1;
      background: #222;
      color: white;
      margin-right: 10px;
    }
    button {
      background: #1e88e5;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1565c0;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="messages" id="messages"></div>
    <div style="display:flex;">
      <input type="text" id="user" placeholder="昵称" style="width:25%;">
      <input type="text" id="msg" placeholder="说点什么..." style="width:60%;">
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://lryfufidcxnxdzglbzgq.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyeWZ1ZmlkY3hueGR6Z2xiemdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwMjkzNzQsImV4cCI6MjA3NjYwNTM3NH0.2EeB26Ga2F2o9doXEhUORBB9k2YZniH-LQvZ5BZSBeU";
    const db = supabase.createClient(supabaseUrl, supabaseKey);

    const AI_NAME = "心语AI";

    async function loadMessages() {
      const { data } = await db.from('messages').select('*').order('created_at', { ascending: true });
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = "";
      data.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg ' + 
          (m.user_name === document.getElementById('user').value ? 'me' : 
           m.user_name === AI_NAME ? 'ai' : '');
        div.innerHTML = `<strong>${m.user_name}</strong>: ${m.message}
          <div class="timestamp">${new Date(m.created_at).toLocaleTimeString()}</div>`;
        messagesDiv.appendChild(div);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const user = document.getElementById('user').value.trim();
      const msg = document.getElementById('msg').value.trim();
      if (!user || !msg) return alert("请输入昵称和内容！");
      await db.from('messages').insert([{ user_name: user, message: msg }]);
      document.getElementById('msg').value = "";
      loadMessages();

      // 模拟 AI 回复
      setTimeout(async () => {
        const aiReply = generateAIReply(msg);
        await db.from('messages').insert([{ user_name: AI_NAME, message: aiReply }]);
        loadMessages();
      }, 2000);
    }

    function generateAIReply(userMsg) {
      userMsg = userMsg.toLowerCase();
      if (userMsg.includes("你好") || userMsg.includes("hello")) return "你好呀～今天过得怎么样？🌸";
      if (userMsg.includes("难过") || userMsg.includes("伤心")) return "别难过，我在呢，一切都会慢慢变好的。💫";
      if (userMsg.includes("开心")) return "真好呀～能看到你开心的样子，我也高兴！😄";
      if (userMsg.includes("喜欢")) return "嗯...喜欢是一件温暖的事，要珍惜这种感觉哦。❤️";
      return "我在认真听呢，说说更多吧～";
    }

    loadMessages();
    setInterval(loadMessages, 2000);
  </script>
</body>
</html>
