<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emovibe 聊天室</title>
  <link rel="stylesheet" href="assets/style.css">

  <style>
    body {
      font-family: "Arial", sans-serif;
      background: linear-gradient(to bottom right, #f7faff, #e6f0ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      width: 90%;
      max-width: 500px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      height: 80vh;
      overflow: hidden;
      margin-top: 40px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .msg {
      padding: 10px 15px;
      border-radius: 12px;
      max-width: 75%;
      line-height: 1.5;
    }

    .msg.user {
      background: #d2e3fc;
      align-self: flex-end;
    }

    .msg.ai {
      background: #f1f3f4;
      align-self: flex-start;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    .input-area button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      background: #4a90e2;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      margin-top: 15px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div id="chat-box" class="chat-box">
      <div class="msg ai">你好，我是 Emovibe 🌷 很高兴与你聊天。</div>
    </div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="说点什么..." />
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>

  <footer>
    <p>© 2025 Emovibe | Hope & Warmth for Everyone</p>
  </footer>

  <script>
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const msg = input.value.trim();
      if (!msg) return;

      const box = document.getElementById('chat-box');
      box.innerHTML += `<div class="msg user">${msg}</div>`;
      input.value = '';
      box.scrollTop = box.scrollHeight;

      // 模拟 AI 回复（可换成真实 API）
      box.innerHTML += `<div class="msg ai">⌛ 正在思考...</div>`;
      box.scrollTop = box.scrollHeight;

      setTimeout(() => {
        const responses = [
          "我在听呢，慢慢说，不用着急。",
          "有时候，说出来本身就是一种治愈。",
          "你做得已经很好了。",
          "每个人都会有低落的时候，我理解你。",
          "一切都会好起来的，相信我。"
        ];
        const aiMsg = responses[Math.floor(Math.random() * responses.length)];
        box.lastChild.innerHTML = aiMsg;
        box.scrollTop = box.scrollHeight;
      }, 1200);
    }
  </script>
</body>
</html>
