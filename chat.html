<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>聊天中 - Emovibe</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script type="module">
    import { supabase } from './assets/supabase.js';

    const chatBox = document.getElementById('chatBox');
    const form = document.getElementById('chatForm');

    async function loadMessages() {
      const { data, error } = await supabase.from('messages').select('*').order('created_at');
      if (error) return alert(error.message);
      chatBox.innerHTML = data.map(m => `
        <p><b>${m.sender}</b>：${m.content}</p>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = e.target.message.value;
      if (!msg) return;
      const { data: user } = await supabase.auth.getUser();
      await supabase.from('messages').insert({
        sender: user.user.email,
        content: msg
      });
      e.target.reset();
      loadMessages();
    });

    loadMessages();
  </script>
</head>
<body>
  <header>
    <h1>一对一聊天</h1>
    <a href="index.html"><button>退出</button></a>
  </header>

  <main>
    <div id="chatBox" class="card" style="height:300px; overflow-y:auto; text-align:left;"></div>

    <form id="chatForm" style="margin-top:10px;">
      <input name="message" placeholder="输入消息..." required />
      <button type="submit" class="primary">发送</button>
    </form>
  </main>
</body>
</html>
