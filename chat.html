<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmoVibe - 情感聊天室</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #0a0a0a;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #111;
      padding: 15px;
      text-align: center;
      font-size: 1.3em;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      background: #1b1b1b;
      padding: 10px 15px;
      border-radius: 8px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .mine {
      align-self: flex-end;
      background: #0078ff;
    }

    #input-area {
      display: flex;
      padding: 10px;
      background-color: #111;
      border-top: 1px solid #333;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      border-radius: 5px;
      margin-right: 10px;
      background: #222;
      color: white;
    }

    button {
      background: #0078ff;
      border: none;
      border-radius: 5px;
      color: white;
      padding: 10px 15px;
      cursor: pointer;
    }

    button:hover {
      background: #005fcc;
    }
  </style>
</head>

<body>
  <header>💬 EmoVibe - 情感聊天室</header>
  <div id="chat-box"></div>

  <div id="input-area">
    <input type="text" id="user_name" placeholder="你的昵称..." />
    <input type="text" id="message_input" placeholder="输入你的消息..." />
    <button id="send_btn">发送</button>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    // ✅ 这是你自己的 Supabase 项目信息（我已替换好）
    const SUPABASE_URL = "https://lryfufidcxnxdzglbzgq.supabase.co";
    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyeWZ1ZmlkY3hueGR6Z2xiemdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwMjkzNzQsImV4cCI6MjA3NjYwNTM3NH0.2EeB26Ga2F2o9doXEhUORBB9k2YZniH-LQvZ5BZSBeU";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const chatBox = document.getElementById("chat-box");
    const sendBtn = document.getElementById("send_btn");
    const msgInput = document.getElementById("message_input");
    const userInput = document.getElementById("user_name");

    // 加载历史消息
    async function loadMessages() {
      const { data, error } = await supabase
        .from("messages")
        .select("*")
        .order("created_at", { ascending: true });

      if (error) {
        console.error("加载消息错误:", error);
        return;
      }

      chatBox.innerHTML = "";
      data.forEach(addMessageToUI);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 添加消息到界面
    function addMessageToUI(msg) {
      const div = document.createElement("div");
      div.className = "message" + (msg.user_name === userInput.value ? " mine" : "");
      div.textContent = `${msg.user_name}: ${msg.message}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 发送消息
    async function sendMessage() {
      const user = userInput.value.trim();
      const message = msgInput.value.trim();

      if (!user || !message) return;

      const { error } = await supabase.from("messages").insert([{ user_name: user, message }]);
      if (error) console.error("发送错误:", error);

      msgInput.value = "";
    }

    sendBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // 实时监听新消息
    supabase
      .channel("public:messages")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
        addMessageToUI(payload.new);
      })
      .subscribe();

    loadMessages();
  </script>
</body>
</html>
