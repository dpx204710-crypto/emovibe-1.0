<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emovibe 聊天室 | Chat</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f4f6fa;
      font-family: "Helvetica Neue", sans-serif;
    }

    header {
      background: linear-gradient(90deg, #4a90e2, #357ab8);
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 600;
    }

    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 800px;
      margin: 1rem auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    #messages {
      padding: 1rem;
      flex-grow: 1;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 1rem;
      display: flex;
      align-items: flex-end;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message p {
      padding: 10px 15px;
      border-radius: 15px;
      max-width: 70%;
    }

    .message.user p {
      background: #4a90e2;
      color: white;
      border-bottom-right-radius: 0;
    }

    .message.bot p {
      background: #f1f1f1;
      color: #333;
      border-bottom-left-radius: 0;
    }

    #chat-form {
      display: flex;
      padding: 1rem;
      background: #fafafa;
      border-top: 1px solid #ddd;
    }

    #chat-form input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }

    #chat-form button {
      margin-left: 10px;
      background: #4a90e2;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
    }

    #chat-form button:hover {
      background: #357ab8;
    }
  </style>
</head>

<body>
  <header>Emovibe 💬 聊天室</header>

  <div id="chat-container">
    <div id="messages"></div>

    <form id="chat-form">
      <input type="text" id="message-input" placeholder="输入你的心情或想说的话..." required />
      <button type="submit">发送</button>
    </form>
  </div>

  <script type="module">
    import { supabase } from './assets/supabase.js'

    const messagesContainer = document.getElementById('messages')
    const form = document.getElementById('chat-form')
    const input = document.getElementById('message-input')

    // 获取当前登录用户
    const { data: { user } } = await supabase.auth.getUser()
    if (!user) {
      alert("请先登录！")
      window.location.href = "login.html"
    }

    // 实时监听新消息
    supabase.channel('realtime:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        const msg = payload.new
        addMessage(msg.user_email === user.email ? 'user' : 'bot', msg.content)
      })
      .subscribe()

    // 加载历史消息
    async function loadMessages() {
      const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true })
      if (error) console.error(error)
      else data.forEach(msg => addMessage(msg.user_email === user.email ? 'user' : 'bot', msg.content))
    }

    // 添加消息到界面
    function addMessage(role, text) {
      const div = document.createElement('div')
      div.className = `message ${role}`
      div.innerHTML = `<p>${text}</p>`
      messagesContainer.appendChild(div)
      messagesContainer.scrollTop = messagesContainer.scrollHeight
    }

    // 发送消息
    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const content = input.value.trim()
      if (!content) return

      const { error } = await supabase.from('messages').insert([{ user_email: user.email, content }])
      if (error) {
        alert('发送失败：' + error.message)
      } else {
        input.value = ''
      }
    })

    loadMessages()
  </script>
</body>
</html>
