<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmoVibe 聊天 | 情感陪伴</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header>
    <h1>💞 EmoVibe 聊天室</h1>
    <p>让每一次倾诉，都被温柔接住</p>
  </header>

  <main class="chat-box">
    <div id="chat-container"></div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="输入你想说的话..." />
      <button onclick="sendMessage()">发送</button>
    </div>
  </main>

  <!-- 引入 Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ✅ 你的 Supabase 项目信息
    const SUPABASE_URL = "https://lryfufidcxnxdzglbzgq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyeWZ1ZmlkY3hueGR6Z2xiemdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwMjkzNzQsImV4cCI6MjA3NjYwNTM3NH0.2EeB26Ga2F2o9doXEhUORBB9k2YZniH-LQvZ5BZSBeU";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const chatContainer = document.getElementById('chat-container');

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      // 显示用户输入
      addMessage('你', text);
      input.value = '';

      // 存入数据库
      await saveMessage('user', text);

      // 显示加载提示
      addMessage('AI', '正在思考中...');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: '你是一个温柔的情感陪伴师，用关怀的语气回答。' },
              { role: 'user', content: text }
            ]
          })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || '抱歉，我暂时无法回答。';

        updateLastMessage(reply);

        // 保存 AI 回复
        await saveMessage('assistant', reply);
      } catch (err) {
        updateLastMessage('⚠️ 出错了，请稍后再试。');
        console.error(err);
      }
    }

    // 添加消息到聊天窗口
    function addMessage(role, content) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.innerHTML = `<strong>${role}：</strong> ${content}`;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 更新最后一条 AI 消息
    function updateLastMessage(content) {
      const lastMsg = chatContainer.lastElementChild;
      if (lastMsg) lastMsg.innerHTML = `<strong>AI：</strong> ${content}`;
    }

    // ✅ 保存聊天到 Supabase
    async function saveMessage(role, content) {
      const { error } = await supabase
        .from('chat_messages')
        .insert([{ role, content, created_at: new Date().toISOString() }]);
      if (error) console.error('保存失败:', error);
    }

    // ✅ 加载历史记录
    async function loadHistory() {
      const { data, error } = await supabase
        .from('chat_messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        console.error('加载失败:', error);
        return;
      }

      data.forEach(msg => {
        const name = msg.role === 'user' ? '你' : 'AI';
        addMessage(name, msg.content);
      });
    }

    loadHistory();
  </script>

  <style>
    body { font-family: "Microsoft YaHei", sans-serif; background: #f8f9fa; margin: 0; }
    header { background: #2c3e50; color: #fff; text-align: center; padding: 20px; }
    .chat-box { max-width: 700px; margin: 40px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,0.1); }
    #chat-container { height: 450px; overflow-y: auto; padding: 10px; border: 1px solid #eee; border-radius: 10px; }
    .message { margin: 8px 0; padding: 6px 10px; border-radius: 8px; max-width: 80%; line-height: 1.5; }
    .message.你 { text-align: right; background: #d1ecf1; margin-left: auto; }
    .message.AI { text-align: left; background: #f8d7da; margin-right: auto; }
    .chat-input { display: flex; margin-top: 15px; }
    .chat-input input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; }
    .chat-input button { margin-left: 8px; padding: 12px 20px; background: #2c3e50; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .chat-input button:hover { background: #1a252f; }
  </style>
</body>
</html>
