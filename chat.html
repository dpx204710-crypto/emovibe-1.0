<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emovibe Chat</title>
  <style>
    body {
      background-color: #f6f9fc;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .chat-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .message {
      padding: 10px 15px;
      margin: 8px 0;
      border-radius: 12px;
      max-width: 75%;
      word-wrap: break-word;
      line-height: 1.5;
    }
    .user {
      align-self: flex-end;
      background: #007aff;
      color: white;
    }
    .ai {
      align-self: flex-start;
      background: #e9ecef;
    }
    .input-area {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ccc;
    }
    input {
      flex: 1;
      border: none;
      outline: none;
      padding: 10px;
      font-size: 16px;
    }
    button {
      background: #007aff;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .error {
      color: red;
      text-align: center;
      margin-top: 30px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chat-container"></div>
  <div class="input-area">
    <input type="text" id="user-input" placeholder="输入消息..." />
    <button onclick="sendMessage()">发送</button>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js";

    // 环境变量（通过 Vercel 自动注入）
    const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL;
    const SUPABASE_KEY = import.meta.env.VITE_SUPABASE_KEY;
    const OPENAI_API_KEY = import.meta.env.VITE_OPENAI_API_KEY;

    const chatContainer = document.getElementById("chat-container");

    // 检查是否缺少环境变量
    if (!SUPABASE_URL || !SUPABASE_KEY || !OPENAI_API_KEY) {
      chatContainer.innerHTML = `
        <div class="error">
          ⚠️ 缺少必要的环境变量：<br><br>
          请前往 <b>Vercel → Settings → Environment Variables</b><br>
          并填写以下变量：<br>
          <code>VITE_SUPABASE_URL</code><br>
          <code>VITE_SUPABASE_KEY</code><br>
          <code>VITE_OPENAI_API_KEY</code>
        </div>`;

    }
