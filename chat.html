<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emovibe Chat</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f0f7ff;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    .chat-box {
      width: 90%;
      max-width: 600px;
      height: 70vh;
      overflow-y: auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 20px;
      margin-top: 20px;
    }
    .message {
      margin: 10px 0;
      line-height: 1.6;
    }
    .user { text-align: right; color: #007aff; }
    .ai { text-align: left; color: #333; }
    .input-box {
      display: flex;
      margin-top: 15px;
      width: 90%;
      max-width: 600px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background: #007aff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      margin-left: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>💬 Emovibe Chat</h2>

  <div class="chat-box" id="chat-box"></div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="说点什么吧..." />
    <button onclick="sendMessage()">发送</button>
  </div>

  <script src="chat.js"></script>
</body>
</html>
