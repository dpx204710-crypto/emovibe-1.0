<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>聊天 - Emovibe</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="container">
  <h1>聊天中 💬</h1>
  <div id="chatBox" style="height:300px;overflow-y:auto;border:1px solid #ccc;padding:10px;border-radius:8px;"></div>

  <input id="messageInput" placeholder="输入消息..." />
  <button id="sendBtn">发送</button>
  <button id="logoutBtn">退出</button>
</div>

<script type="module">
import { supabase, sendMessage, listenMessages } from './app.js'

const params = new URLSearchParams(window.location.search)
const roomId = params.get('room')
const chatBox = document.getElementById('chatBox')

async function addMessage(msg) {
  const div = document.createElement('div')
  div.textContent = msg.content
  chatBox.appendChild(div)
  chatBox.scrollTop = chatBox.scrollHeight
}

listenMessages(roomId, addMessage)

document.getElementById('sendBtn').onclick = async () => {
  const content = document.getElementById('messageInput').value
  if (!content) return
  await sendMessage(roomId, null, content)
  document.getElementById('messageInput').value = ''
}

document.getElementById('logoutBtn').onclick = async () => {
  await supabase.auth.signOut()
  window.location = 'index.html'
}
</script>
</body>
</html>
